<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HuntedRaven7</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #58a6ff, #bc8cff);
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #0d1117;
            font-weight: 700;
        }

        h1 {
            font-size: 2rem;
            color: #f0f6fc;
            margin-bottom: 0.5rem;
        }

        .tagline {
            font-size: 1.1rem;
            color: #8b949e;
            margin-bottom: 2rem;
        }

        .links {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .links a {
            display: inline-block;
            padding: 0.6rem 1.4rem;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #58a6ff;
            text-decoration: none;
            font-size: 0.95rem;
            transition: border-color 0.2s, background 0.2s;
        }

        .links a:hover {
            border-color: #58a6ff;
            background: rgba(88, 166, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="avatar">HR</div>
        <h1>HuntedRaven7</h1>
        <p class="tagline">Developer &bull; Builder &bull; Tinkerer</p>
        <div class="links">
            <a href="https://github.com/HuntedRaven7">GitHub</a>
        </div>
    </div>
</body>
</html>
